# .github/workflows/pages.yml
name: Publier sur GitHub Pages

on:
  push:
    # Les deux noms : `git init` crée `master` sur beaucoup d'installations,
    # `gh repo create --push` fait de la branche courante la branche par défaut,
    # et une publication qui ne se déclenche jamais est très déroutante.
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests des moteurs
        run: node --test 'tests/**/*.test.js'
      - name: Rassembler le site
        # Publier `.` mettrait en ligne l'atelier avec l'ouvrage : le plan, le
        # spec, la chaîne Python de fabrication du dictionnaire et les tests.
        # Rien de secret, mais rien qui ait sa place sur le site non plus.
        run: |
          mkdir -p _site
          cp -r index.html main.js sw.js manifest.webmanifest \
                css core games lexicon data icons _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploiement
        uses: actions/deploy-pages@v4
